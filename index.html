<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>100 Days</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://w3.org viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💛</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  /* ============================================================
     EDIT ME: your settings live here
     ============================================================ */

  /* (JS config is further down the file, search for CONFIG) */

  :root{
    --cream: #FBF2E7;
    --paper: #FFFCF6;
    --ink: #4A3B32;
    --ink-soft: #8A7566;
    --rose: #C97B63;
    --rose-soft: #EAC3B3;
    --sage: #8A9B7C;
    --sage-soft: #D9E2CF;
    --gold: #D9A441;
    --shadow: rgba(74, 59, 50, 0.18);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(circle at 15% 10%, rgba(217,164,65,0.10), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(138,155,124,0.12), transparent 45%),
      var(--cream);
    font-family: 'Quicksand', sans-serif;
    color: var(--ink);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 48px 20px 80px;
  }

  .title{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: clamp(2.6rem, 6vw, 4.2rem);
    margin: 0 0 4px;
    color: var(--rose);
    text-align:center;
    line-height:1;
  }

  .subtitle{
    font-size: 1rem;
    color: var(--ink-soft);
    margin: 0 0 40px;
    text-align:center;
    max-width: 420px;
  }

  /* ---- hero card / envelope ---- */

  .stage{
    perspective: 1400px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 56px;
  }

  .card{
    position:relative;
    background: var(--paper);
    border-radius: 18px;
    padding: 40px 32px 36px;
    box-shadow: 0 14px 32px var(--shadow);
    border: 1px solid rgba(74,59,50,0.06);
    min-height: 220px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    text-align:center;
    transform-style: preserve-3d;
    transition: transform 0.5s ease;
  }

  .card.flip{ animation: flipIn 0.55s ease; }
  @keyframes flipIn{
    0%   { transform: rotateX(90deg); opacity: 0; }
    60%  { transform: rotateX(-8deg); opacity: 1; }
    100% { transform: rotateX(0deg); }
  }

  .card .day-label{
    font-family:'Caveat', cursive;
    font-size: 1.6rem;
    color: var(--sage);
    margin-bottom: 14px;
  }.date-label{
    font-size: 0.85rem; 
    color:var(--ink-soft); 
    margin-bottom: 16px;
  }

  .card .message{
    font-size: 1.15rem;
    line-height: 1.6;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .card .hint{
    margin-top: 18px;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  .doodle{
    position:absolute;
    opacity:0.55;
  }
  .doodle.heart{ top:-14px; left:-14px; width:34px; }
  .doodle.star{ bottom:-12px; right:-10px; width:30px; }

  /* ---- grid ---- */

  .grid-wrap{
    width:100%;
    max-width: 640px;
  }

  .grid-label{
    font-family:'Caveat', cursive;
    font-size: 1.4rem;
    color: var(--ink-soft);
    margin: 0 0 14px 4px;
  }

  .grid{
    display:grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 8px;
  }

  @media (max-width: 520px){
    .grid{ grid-template-columns: repeat(6, 1fr); }
  }

  .tile{
    aspect-ratio: 1;
    border-radius: 9px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size: 0.78rem;
    cursor: default;
    user-select:none;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    border: 1px solid transparent;
  }

  .tile.locked{
    background: rgba(138,117,102,0.08);
    color: rgba(138,117,102,0.55);
  }

  .tile.unlocked{
    background: var(--rose-soft);
    color: var(--ink);
    cursor: pointer;
    box-shadow: 0 2px 6px rgba(201,123,99,0.25);
  }

  .tile.unlocked:hover{
    transform: translateY(-2px);
  }

  .tile.today{
    background: var(--gold);
    color: var(--paper);
    box-shadow: 0 3px 10px rgba(217,164,65,0.45);
  }

  .tile.active{
    outline: 2px solid var(--rose);
    outline-offset: 2px;
  }

  footer{
    margin-top: 56px;
    font-size: 0.8rem;
    color: var(--ink-soft);
    text-align:center;
  }

</style>
</head>
<body>

  <h1 class="title" id="titleText">100 little notes</h1>
  <p class="subtitle" id="subtitleText">One for every day, until I run out of days to miss you less.</p>

  <div class="stage">
    <div class="card" id="card">
      <svg class="doodle heart" viewBox="0 0 24 24" fill="none" stroke="#C97B63" stroke-width="1.6"><path d="M12 20s-7-4.5-9.5-9C.5 7 2.5 3 6.5 3c2 0 3.5 1.2 4.5 2.6C12 4.2 13.5 3 15.5 3 19.5 3 21.5 7 19.5 11 17 15.5 12 20 12 20z"/></svg>
      <div class="day-label" id="dayLabel">Day 1</div>
      <div class="date-label" id="dateLabel"></div>
      <div class="message" id="messageText">Loading…</div>
      <div class="hint" id="hintText"></div>
      <svg class="doodle star" viewBox="0 0 24 24" fill="none" stroke="#D9A441" stroke-width="1.6"><path d="M12 2l2.2 6.8H21l-5.6 4.1 2.1 6.9L12 15.9 6.5 19.8l2.1-6.9L3 8.8h6.8z"/></svg>
    </div>
  </div>

  <div class="grid-wrap">
    <p class="grid-label">tap any open day to read it again</p>
    <div class="grid" id="grid"></div>
  </div>

  <footer>made with love, one day at a time</footer>

<script>

  /* ============================================================
     CONFIG — edit these three things before you publish
     ============================================================ */
  const CONFIG = {
    // Her IANA timezone name — this is what makes the calendar unlock
    // at midnight HER time, no matter where either of you actually are.
    // Examples: 'America/Toronto', 'America/New_York', 'Europe/London', 'Asia/Seoul' 
    // 'Europe/Madrid', 'Asia/Tokyo'. Full list: look up "IANA timezone list".
    timezone: 'Asia/Seoul' ,

    // The first day the calendar should unlock, in YYYY-MM-DD format.
    // Day 1 unlocks on this date (her time), day 2 the next day, etc.
    startDate: '2026-09-23',

    // Shown in the title/subtitle up top — optional personal touches.
    title: '100 little notes',
    subtitle: 'One for every day, until I run out of days to miss you less.'
  };

  /* ============================================================
     YOUR 100 MESSAGES — replace every line below with your own.
     Keep exactly 100 entries, in order, day 1 first.
     ============================================================ */
  const MESSAGES = [
    "From an unconventional first contact to being the love of my life. \nI want to celebrate our first year together the next 100 days!",
"The way you're kind above all, I love.",
"The way we are and will be inseparable yet lead our own fulfilling lives, I love.",
"The way I was able to spoil you on your birthday, I love.",
"The way you care about taking care of the people close to you, I love.",
"The way you wake up with energy every day, I love.",
"The way we'll go on our own adventures in the future, I love.",
"The way I've learned how you think, I love.",
"The way you can stay strong through life-changing events, I love.",
"The way I can stay by your side through every rough patch, I love.",
"The way we see each other as we are and not as we hope, I love.",
"The way your love for Hakka food transcends everything else, I love.",
"The way you know when to push and pull harder, I love.",
"The way we back each other and see things as us vs the problem, I love.",
"The way I can experience new things through your love of them, I love.",
"The way you notice the little things, I love.",
"The way we work hard together, in our own ways, yet united, I love.",
"The way you wonder about the places you haven't been, I love.",
"The way we see each other in our futures, I love.",
"The way your beauty has me in a daze, I love.",
"The way everything in my life has led to you, I love.",
"The way planning is our love language, I love.",
"The way I can spoil your friends on your behalf, I love.",
"The way we can be vulnerable with each other, I love.",
"The way you take things day by day, I love.",
"Happy 1 year anniversary my love! I'm so grateful for everything we've done together and looking forward to what we'll do in the future :)",
"The way we've expressed interest in each others' hobbies, I love.",
"The way you place emphasis on no clutter, I love.",
"The way we both have a sweet tooth, I love.",
"The way you keep me accountable, I love.",
"The way you have a deep appreciation for everything, I love.",
"The way I know your favourites, I love.",
"The way you light up the room, I love.",
"The way we brainstorm to face things, I love.",
"The way you've warmed up to surprises, I love.",
"The way I give you true devotion and no lip service, I love.",
"The way we can be each others' calm, I love.",
"The way we choose each other every day, I love.",
"The way I see you in the everyday little things, I love.",
"The way your curves flow seamlessly across your body, I love.",
"The way you let me take the first step towards something new, I love.",
"The way you support me through those first steps, I love.",
"The way we create opportunity for each other, I love.",
"The way we're a wait-and-see, not a react now couple, I love.",
"The way you feel safe with me, I love.",
"The way you're so open minded, I love.",
"The way you have me craving to be locked up, I love.",
"The way I keep being finding new parts of you, I love.",
"The way we don't waver for each other, I love.",
"The way our heads can clear for each other, I love.",
"The way our levels of skepticism complement each other, I love.",
"The way we embrace the arts, I love.",
"The way we want to try new things, I love.",
"The way my hands will fit your body perfectly, I love.",
"The way you see the best in everything, I love.",
"The way you always know the best spots, I love.",
"The way you've invited me into your life, I love.",
"The way you take words seriously, I love.",
"The way you keep my ass filled...I love.",
"The way we can talk about anything with wonder, I love.",
"The way you communicate clearly, I love.",
"The way you tell me to be patient, I love.",
"The way your taste is so diverse, I love.",
"The way I can bring you clarity, I love.",
"The way there's always an event to look forward to, I love.",
"The way I wake up grateful you've come into my life, I love.",
"The way you critique film, I love.",
"The way we can have differing opinions, I love.",
"The way I feel my body needing you, I love.",
"The way you've taught me how to love you, I love.",
"The way you stay humble, I love.",
"The way you tease me, I love",
"The way you accept my faults, I love.",
"The way you feel safe to open up, I love.",
"The way you open your secrets to me, I love.",
"The way you smile deeply, I love.",
"The way our words have had so much effect on each other, I love.",
"The way you try to curate your recommendations, I love.",
"The way we'll hike all day and come back to a cozy show with some good food, I love.",
"The way you believe in me yet keep me grounded, I love.",
"The way every new experience becomes a new favourite, I love.",
"The way what is mine is yours, I love.",
"The way you know how to step back and apologize, I love.",
"The way you trained me in....ways, I love.",
"The way you can center me, I love.",
"The way you challenge me to be better, I love.",
"The way you put the best into every day, I love.",
"The way I'll take the best pictures of you, I love.",
"The way I'm learning how to tell you how important you are more often, I love.",
"The way you aren't materialistic, I love.",
"The way I'll have a full gift box waiting for you, I love.",
"The way I'm so delighted to see your message, I love.",
"The way you get mesmerized by my sluttiness, I love.",
"The way you push me to creating so much for you, I love.",
"The way we can see eye to eye, I love.",
"The way you love a live message at events, I love.",
"The way you sparkle when you're excited, I love.",
"The way you're beautiful inside and out, I love.",
"The way this many words isn't nearly enough.",
"To the rest of our lives :)"
  ]

  /* ============================================================
     Logic — you shouldn't need to touch anything below this line
     ============================================================ */

  document.getElementById('titleText').textContent = CONFIG.title;
  document.getElementById('subtitleText').textContent = CONFIG.subtitle;

  function todayInTZ(tz){
    const fmt = new Intl.DateTimeFormat('en-CA', {
      timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit'
    });
    return fmt.format(new Date()); // -> "YYYY-MM-DD"
  }

  function daysBetween(a, b){
    const [ay, am, ad] = a.split('-').map(Number);
    const [by, bm, bd] = b.split('-').map(Number);
    const da = Date.UTC(ay, am - 1, ad);
    const db = Date.UTC(by, bm - 1, bd);
    return Math.round((db - da) / 86400000);
  }

  function formatDateForDay(n){
    const [y, m, d] = CONFIG.startDate.split('-').map(Number);
    const dateObj = new Date(Date.UTC(y, m - 1, d));
    dateObj.setUTCDate(dateObj.getUTCDate() + (n - 1));
    return dateObj.toLocaleDateString('en-US', { timeZone: 'UTC', month: 'long', day: 'numeric', year: 'numeric' });
  }

  const todayStr = todayInTZ(CONFIG.timezone);
  const dayIndex = daysBetween(CONFIG.startDate, todayStr) + 1; // 1-based

  const grid = document.getElementById('grid');
  const card = document.getElementById('card');
  const dayLabel = document.getElementById('dayLabel');
  const dateLabel = document.getElementById('dateLabel');
  const messageText = document.getElementById('messageText');
  const hintText = document.getElementById('hintText');

  let activeTile = null;

  function showDay(n, tileEl){
    dayLabel.textContent = `Day ${n}`;
    dateLabel.textContent = formatDateForDay(n);
    messageText.textContent = MESSAGES[n - 1];
    hintText.textContent = (dayIndex > 90 && n === 90)
      ? 'that was the last one — but not the last of anything else.'
      : '';
    card.classList.remove('flip');
    void card.offsetWidth;
    card.classList.add('flip');
    if(activeTile) activeTile.classList.remove('active');
    if(tileEl){ tileEl.classList.add('active'); activeTile = tileEl; }
  }

  for(let n = 1; n <= 100; n++){
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.textContent = n;
  
    if(n > dayIndex){
      tile.classList.add('locked');
    } else if(n === dayIndex){
      tile.classList.add('today');
      tile.addEventListener('click', () => showDay(n, tile));
    } else {
      tile.classList.add('unlocked');
      tile.addEventListener('click', () => showDay(n, tile));
    }
    grid.appendChild(tile);
  }

  if(dayIndex < 1){
    dayLabel.textContent = 'not yet';
    dateLabel.textContent = '';
    messageText.textContent = `Come back on ${CONFIG.startDate} for day one 💛`;
  } else if(dayIndex > 100){
    showDay(100, grid.children[99]);
  } else {
    showDay(dayIndex, grid.children[dayIndex - 1]);
  }

</script>
</body>
</html>
